    <polygon points="18,3 31,10.5 31,25.5 18,33 5,25.5 5,10.5" fill="#1A2D5C"/>
    <circle cx="13" cy="16" r="2.2" fill="#FFC830"/>
    <circle cx="23" cy="16" r="2.2" fill="#FFC830"/>
    <path d="M13.5 22.5 Q18 25.5 22.5 22.5" stroke="#FFC830" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </symbol>

