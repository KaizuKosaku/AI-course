    <circle cx="67.5" cy="42" r="3.2" fill="#ffc830" stroke="#1a2d5c" stroke-width="1.6"/>
    <polygon points="36,12 61,26.5 61,55.5 36,70 11,55.5 11,26.5" fill="#1a2d5c" stroke="#1a2d5c" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="36,12 61,26.5 61,33 36,19 11,33 11,26.5" fill="#2e4785"/>
    <rect x="18" y="31" width="36" height="24" rx="10" fill="#243a73"/>
    <circle cx="27" cy="41" r="5" fill="#ffc830"/>
    <circle cx="45" cy="41" r="5" fill="#ffc830"/>
    <circle cx="28.2" cy="40" r="2.1" fill="#1a2d5c"/>
    <circle cx="46.2" cy="40" r="2.1" fill="#1a2d5c"/>
    <circle cx="29" cy="39.2" r="0.8" fill="#fff"/>
